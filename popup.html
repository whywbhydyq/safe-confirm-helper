<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Safe Confirm Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Safe Confirm Helper</h1>
        <p id="page-status">正在连接当前页面...</p>
      </div>
      <span id="connection-pill" class="pill">连接中</span>
    </header>

    <section class="hero-card">
      <span class="eyebrow">当前状态</span>
      <strong id="task-state">待检测</strong>
      <p id="task-reason">等待页面状态</p>
      <div class="meta-row">
        <span id="continue-count">已自动继续 0 次</span>
        <span id="final-state">等待最终自检</span>
      </div>
    </section>

    <section class="actions primary-actions">
      <button id="primary-action-btn" class="primary" type="button">暂停自动继续</button>
      <button id="reset-task-btn" type="button">重置当前任务</button>
    </section>

    <section class="status-card compact-card">
      <span class="eyebrow">当前页面</span>
      <strong id="candidate-text">安全确认：等待扫描</strong>
      <small id="scan-info">只会自动点击弹窗内的确认按钮</small>
    </section>

    <details class="panel advanced-panel" open>
      <summary>设置</summary>

      <section class="advanced-section">
        <div class="section-title"><span>运行控制</span></div>
        <label class="setting-row">
          <span><strong>插件总开关</strong><small>关闭后停止全部自动行为</small></span>
          <input id="enabled-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row">
          <span><strong>长任务监督</strong><small>点击主按钮后接管当前页下一条真实任务</small></span>
          <input id="supervise-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row">
          <span><strong>自动继续</strong><small>未完成最终自检时继续或审计</small></span>
          <input id="auto-continue-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row">
          <span><strong>安全确认</strong><small>仅自动点击弹窗内确认按钮</small></span>
          <input id="auto-confirm-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row">
          <span><strong>保持底部</strong><small>普通模式可自选；监督开启后强制开启</small></span>
          <input id="keep-bottom-input" class="switch-input" type="checkbox">
        </label>
      </section>

      <section class="advanced-section">
        <div class="section-title"><span>确认按钮</span></div>
        <div class="actions two-col">
          <button id="confirm-btn" type="button">手动点击候选确认</button>
          <button id="rescan-btn" type="button">重新扫描</button>
        </div>
        <label class="setting-row compact">
          <span>识别英文按钮</span>
          <input id="english-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row compact">
          <span>高亮候选按钮</span>
          <input id="highlight-input" class="switch-input" type="checkbox">
        </label>
      </section>

      <section class="advanced-section">
        <div class="section-title"><span>自动继续参数</span></div>
        <label class="setting-row compact">
          <span>最大继续次数</span>
          <input id="max-continue-input" class="number-input" type="number" min="1" max="200">
        </label>
        <label class="setting-row compact">
          <span>继续冷却 ms</span>
          <input id="cooldown-input" class="number-input" type="number" min="1000" max="120000" step="1000">
        </label>
        <label class="setting-row compact">
          <span>审计间隔</span>
          <input id="audit-every-input" class="number-input" type="number" min="1" max="20">
        </label>
      </section>

      <section class="advanced-section prompt-panel">
        <div class="section-title"><span>继续提示词</span><small id="prompt-state">已同步</small></div>
        <textarea id="continue-prompt-input" rows="4" spellcheck="false"></textarea>
        <div class="prompt-tools">
          <span>停止条件：最终自检通过</span>
          <button id="reset-prompt-btn" type="button">恢复默认</button>
        </div>
      </section>
    </details>
  </main>
  <script src="popup.js"></script>
  <script src="popup-scroll-now.js"></script>
</body>
</html>
