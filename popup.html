<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Confirm Helper</title><link rel="stylesheet" href="popup.css"></head><body><main class="app"><header class="topbar"><div><h1>Safe Confirm Helper</h1><p id="page-status">正在连接当前页面...</p></div><label class="master-switch"><span class="master-text">插件</span><input id="enabled-input" type="checkbox"><span class="track"></span></label></header><section class="status-card"><span class="eyebrow">长任务监督</span><strong id="task-state">待检测</strong><small id="task-reason">等待页面状态</small></section><section class="status-grid"><div class="mini-card"><span>自动继续</span><strong id="continue-count">0 / 50</strong></div><div class="mini-card"><span>Final</span><strong id="final-state">未检测</strong></div></section><section class="status-card"><span class="eyebrow">当前候选按钮</span><strong id="candidate-text">-</strong><small id="scan-info">等待扫描</small></section><section class="panel"><div class="section-title"><span>核心开关</span></div><label class="setting-row"><span><strong>长任务监督</strong><small>自动识别长任务并追加一次监督协议</small></span><input id="supervise-input" class="switch-input" type="checkbox"></label><label class="setting-row"><span><strong>自动继续</strong><small>未出现合格 SCH_FINAL 时继续或审计</small></span><input id="auto-continue-input" class="switch-input" type="checkbox"></label><label class="setting-row"><span><strong>自动确认</strong><small>发现确认类按钮时自动点击</small></span><input id="auto-confirm-input" class="switch-input" type="checkbox"></label><label class="setting-row"><span><strong>保持底部</strong><small>对话持续贴近最新回复</small></span><input id="keep-bottom-input" class="switch-input" type="checkbox"></label></section><section class="actions"><button id="confirm-btn" class="primary" type="button">尝试点击确认</button><button id="rescan-btn" type="button">重新扫描</button></section><section class="panel prompt-panel"><div class="section-title"><span>继续提示词</span><small id="prompt-state">已同步</small></div><textarea id="continue-prompt-input" rows="4" spellcheck="false"></textarea><div class="prompt-tools"><span>停止条件：合格 SCH_FINAL</span><button id="reset-prompt-btn" type="button">恢复默认</button></div></section><details class="panel advanced-panel"><summary>高级设置</summary><label class="setting-row compact"><span>最大继续次数</span><input id="max-continue-input" class="number-input" type="number" min="1" max="200"></label><label class="setting-row compact"><span>继续冷却 ms</span><input id="cooldown-input" class="number-input" type="number" min="1000" max="120000" step="1000"></label><label class="setting-row compact"><span>审计间隔</span><input id="audit-every-input" class="number-input" type="number" min="1" max="20"></label><label class="setting-row compact"><span>识别英文按钮</span><input id="english-input" class="switch-input" type="checkbox"></label><label class="setting-row compact"><span>高亮候选按钮</span><input id="highlight-input" class="switch-input" type="checkbox"></label><button id="reset-task-btn" type="button">重置当前监督状态</button></details></main><script src="popup.js"></script></body></html>
