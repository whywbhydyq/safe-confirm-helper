<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safe Confirm Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Safe Confirm Helper</h1>
          <p id="page-status">正在连接当前页面...</p>
        </div>
        <label class="master-switch" title="启用插件">
          <span class="master-text">插件</span>
          <input id="enabled-input" type="checkbox">
          <span class="track"></span>
        </label>
      </header>

      <section class="status-card">
        <div>
          <span class="eyebrow">当前候选</span>
          <strong id="candidate-text">-</strong>
        </div>
        <small id="scan-info">等待扫描</small>
      </section>

      <section class="panel">
        <div class="section-title">
          <span>自动化</span>
          <small id="task-state">待检测</small>
        </div>
        <label class="setting-row">
          <span>
            <strong>自动确认</strong>
            <small>发现确认按钮时自动点击</small>
          </span>
          <input id="auto-confirm-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row">
          <span>
            <strong>保持底部</strong>
            <small>对话持续贴近最新回复</small>
          </span>
          <input id="keep-bottom-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row">
          <span>
            <strong>自动继续</strong>
            <small>模型停下后发送继续提示</small>
          </span>
          <input id="auto-continue-input" class="switch-input" type="checkbox">
        </label>
      </section>

      <section class="actions">
        <button id="confirm-btn" class="primary" type="button">尝试点击确认</button>
        <button id="rescan-btn" type="button">重新扫描</button>
      </section>

      <section class="panel prompt-panel">
        <div class="section-title">
          <span>继续提示词</span>
          <small id="prompt-state">已同步</small>
        </div>
        <textarea id="continue-prompt-input" rows="5" spellcheck="false"></textarea>
        <div class="prompt-tools">
          <span>完成语句：任务已完成</span>
          <button id="reset-prompt-btn" type="button">恢复默认</button>
        </div>
      </section>

      <section class="panel advanced-panel">
        <div class="section-title">
          <span>识别设置</span>
        </div>
        <label class="setting-row compact">
          <span>识别英文按钮</span>
          <input id="english-input" class="switch-input" type="checkbox">
        </label>
        <label class="setting-row compact">
          <span>高亮候选按钮</span>
          <input id="highlight-input" class="switch-input" type="checkbox">
        </label>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
